services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cue}
      POSTGRES_USER: ${POSTGRES_USER:-cue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env.compose}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cue}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cue}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Define BETTER_AUTH_SECRET in .env.compose}
      BETTER_AUTH_URL: http://localhost:5173
      CLIENT_ORIGIN: http://localhost:5173
      WORKER_TOKEN: ${WORKER_TOKEN:?Define WORKER_TOKEN in .env.compose}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:?Define TMDB_API_TOKEN in .env.compose}
      TMDB_API_KEY: ${TMDB_API_KEY:?Define TMDB_API_KEY in .env.compose}
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/server.js"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  worker-webserver:
    build:
      context: ./worker
      dockerfile: Dockerfile
    command:
      [
        "dagster-webserver",
        "-h",
        "0.0.0.0",
        "-p",
        "3000",
        "-m",
        "orchestrator.definitions",
      ]
    environment: &worker-environment
      API_URL: http://backend:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cue}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cue}
      WORKER_TOKEN: ${WORKER_TOKEN:?Define WORKER_TOKEN in .env.compose}
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_STORAGE_DIR: /opt/dagster/dagster_home/state/storage
      DAGSTER_COMPUTE_LOGS_DIR: /opt/dagster/dagster_home/state/compute_logs
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - dagster_home:/opt/dagster/dagster_home/state
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  worker-daemon:
    build:
      context: ./worker
      dockerfile: Dockerfile
    command: ["dagster-daemon", "run"]
    environment: *worker-environment
    volumes:
      - dagster_home:/opt/dagster/dagster_home/state
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  dagster_home:
