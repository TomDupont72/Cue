[project]
name = "worker"
requires-python = ">=3.10,<3.15"
version = "0.9.2"
dependencies = [
    "dagster==1.13.16",
    "dagster-webserver>=1.13.16",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "orchestrator"
registry_modules = [
    "worker.components.*",
]


