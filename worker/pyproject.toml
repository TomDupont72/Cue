[project]
name = "worker"
requires-python = ">=3.12,<3.15"
version = "0.9.4"
dependencies = [
    "dagster==1.13.16",
    "dagster-webserver>=1.13.16",
    "httpx>=0.28.1",
    "pydantic>=2.13.4,<3",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
]

[project.optional-dependencies]
dev = [
    "dagster-dg-cli",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "orchestrator"
registry_modules = [
    "worker.components.*",
]
