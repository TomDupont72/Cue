storage:
  sqlite:
    base_dir:
      env: DAGSTER_STORAGE_DIR

compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir:
      env: DAGSTER_COMPUTE_LOGS_DIR

concurrency:
  runs:
    tag_concurrency_limits:
      - key: cue/sync_series
        value: "true"
        limit: 1
