name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint/test/coverage/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test (with coverage)
        run: npm run test --if-present

      - name: Build
        run: npm run build

      - name: Upload coverage (frontend)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
          if-no-files-found: warn

  backend:
    name: Backend (lint/test/coverage/build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cue
          POSTGRES_PASSWORD: cue
          POSTGRES_DB: cue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cue -d cue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      INTEGRATION_TEST_DATABASE: "true"
      HOST: localhost
      DATABASE_URL: postgresql://cue:cue@localhost:5432/cue_test
      BETTER_AUTH_SECRET: ci-better-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:8000
      CLIENT_ORIGIN: http://localhost:5173
      WORKER_TOKEN: ci-worker-token-at-least-32-characters
      TMDB_API_TOKEN: ci-tmdb-token-at-least-32-characters
      TMDB_API_KEY: ci-tmdb-api-key-placeholder

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build

      - name: Upload coverage (backend)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: backend/coverage/lcov.info
          if-no-files-found: warn

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - uses: actions/checkout@v6

      - name: Build backend image
        run: docker build -t cue-backend ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            -t cue-frontend ./frontend

      - name: Build worker image
        run: docker build -t cue-worker ./worker

      - name: Validate development Compose
        run: docker compose --env-file .env.compose.example -f compose.dev.yaml config

      - name: Validate production Compose
        run: docker compose -f compose.prod.yaml config --no-interpolate
